name: TEMPORARY exact domain source recovery

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/recover-domain-source.yml"]

permissions:
  contents: read

jobs:
  recover:
    if: github.head_ref == 'recovery/domain-source-format-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10.34.5 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Restore exact formatter output and require the known source tree
        run: |
          test "$(git rev-parse HEAD^)" = "38add3d20f76480bb44e128b201b61bfa7461d4c"
          pnpm install --frozen-lockfile --ignore-scripts
          test "$(pnpm exec prettier --version)" = "3.7.4"
          pnpm exec prettier --write server/deployment-origins.test.ts scripts/check-frontend-http.mts
          git add -- server/deployment-origins.test.ts scripts/check-frontend-http.mts
          git rm --cached -- .github/workflows/recover-domain-source.yml
          recovered_tree=$(git write-tree)
          echo "ACTUAL_RECOVERY_TREE=$recovered_tree"
          test "$recovered_tree" = "bb782975b9c164c64317a54a3928a24a9eaa5832"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          for (const path of ["server/deployment-origins.test.ts", "scripts/check-frontend-http.mts"]) {
            console.log("RECOVERED_FILE_JSON=" + JSON.stringify({ path, content: readFileSync(path, "utf8") }));
          }
          NODE
