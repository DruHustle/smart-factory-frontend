name: OpenUSD qualification
on:
  push:
    branches: [feat/openusd-industrial-library]
    paths:
      - 'scripts/equipment/convert_openusd.py'
      - 'scripts/equipment/openusd/**'
      - '.github/workflows/openusd-qualification.yml'
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: openusd-authoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  author:
    if: github.ref == 'refs/heads/feat/openusd-industrial-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10.34.5 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed Blender 4.5 importer option correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/equipment/convert_openusd.py')
          s=p.read_text()
          old='import_blendshapes=False, import_subdivision=False,'
          new='import_blendshapes=False, import_subdiv=False,'
          assert s.count(old)==1 or s.count(new)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Build isolated CPU authoring tool
        run: docker build -f scripts/equipment/openusd/Dockerfile -t smart-factory-openusd-authoring .
      - name: Acquire immutable sources and verify per-package licensing
        run: python3 scripts/equipment/openusd/fetch_sources.py --output "$RUNNER_TEMP/nvidia-sources" | tee "$RUNNER_TEMP/openusd-source.log"
      - name: Convert with no network, no credentials, bounded CPU and memory
        run: |
          mkdir -p "$RUNNER_TEMP/openusd-output/public" "$RUNNER_TEMP/openusd-output/shared"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 5g --cpus 2 --pids-limit 512 --shm-size 256m --tmpfs /tmp:rw,nosuid,nodev,size=512m --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$RUNNER_TEMP/nvidia-sources:/sources:ro" \
            -v "$GITHUB_WORKSPACE/scripts/equipment/openusd/curated.json:/config/curated.json:ro" \
            -v "$RUNNER_TEMP/openusd-output:/output:rw" \
            smart-factory-openusd-authoring --config /config/curated.json --sources /sources --public-output /output/public --catalog-output /output/shared/industrial-assets.catalog.json 2>&1 | tee "$RUNNER_TEMP/openusd-conversion.log"
      - name: Validate every generated package through the existing API admission contract
        env: { OUTPUT: '${{ runner.temp }}/openusd-output' }
        run: |
          node --import tsx --input-type=module <<'JS'
          import fs from 'node:fs';
          import {validateModelPackage} from './server/equipment/packages.ts';
          const root=process.env.OUTPUT;
          const catalog=JSON.parse(fs.readFileSync(root+'/shared/industrial-assets.catalog.json','utf8'));
          let total=0;
          for(const asset of catalog.assets) for(const [quality,model] of Object.entries(asset.models)) {
            const bytes=fs.readFileSync(root+'/public/'+model.url.replace('/models/nvidia/',''));
            const validated=validateModelPackage(bytes,model.manifest);
            if(validated.sha256!==model.sha256 || bytes.length!==model.bytes || validated.budget.triangles!==model.triangles) throw Error('Converted package identity mismatch');
            total+=bytes.length;
            console.log(asset.slug,quality,validated.budget);
          }
          if(total>40*1024*1024) throw Error('Bundled library exceeds 40 MiB');
          JS
      - name: Commit only validated generated assets to the isolated implementation branch
        env: { EXPECTED: '${{ github.sha }}' }
        run: |
          remote=$(git ls-remote origin refs/heads/feat/openusd-industrial-library | cut -f1)
          [[ "$remote" == "$EXPECTED" ]] || { echo 'Implementation branch advanced; retain artifacts without overwriting work.'; exit 1; }
          mkdir -p client/public/models/nvidia
          cp -R "$RUNNER_TEMP/openusd-output/public/." client/public/models/nvidia/
          cp "$RUNNER_TEMP/openusd-output/shared/industrial-assets.catalog.json" shared/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/models/nvidia shared/industrial-assets.catalog.json scripts/equipment/convert_openusd.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add qualified NVIDIA browser models with immutable provenance and attribution'
            git push origin HEAD:refs/heads/feat/openusd-industrial-library
          fi
      - name: Retain conversion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openusd-authoring-evidence
          path: |
            ${{ runner.temp }}/openusd-output/
            ${{ runner.temp }}/openusd-*.log
          retention-days: 7
