name: OpenUSD asset source review
on:
  push:
    branches: [feat/openusd-industrial-library]
    paths: ['.github/workflows/openusd-asset-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect official NVIDIA packages without changing production
        run: |
          mkdir -p "$RUNNER_TEMP/nvidia-review"
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nvidia-review'
          base = 'https://huggingface.co'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Smart-Factory-asset-review/1.0'}), timeout=60) as r:
                  return r.read(16 * 1024 * 1024)
          info = json.loads(get(base + '/api/datasets/nvidia/simready-assets'))
          revision = info['sha']
          (out / 'dataset.json').write_text(json.dumps(info, indent=2))
          print('Pinned dataset revision:', revision)
          roots = json.loads(get(base + '/api/datasets/nvidia/simready-assets/tree/' + revision + '?limit=1000'))
          (out / 'root-tree.json').write_text(json.dumps(roots, indent=2))
          for asset in ['conveyor_belt_a61','rack_long_empty_a01','cart_mobile_e01']:
              try:
                  tree = json.loads(get(base + '/api/datasets/nvidia/simready-assets/tree/' + revision + '/' + asset + '?recursive=true&limit=1000'))
                  (out / (asset + '-tree.json')).write_text(json.dumps(tree, indent=2))
                  for f in tree:
                      name = f['path']
                      if f['type'] == 'file' and (name.endswith('.json') or 'LICENSE' in name):
                          data = get(base + '/datasets/nvidia/simready-assets/resolve/' + revision + '/' + name)
                          p = out / name
                          p.parent.mkdir(parents=True, exist_ok=True)
                          p.write_bytes(data)
                  print(asset, 'files', len(tree), 'bytes', sum(f.get('size',0) for f in tree if f['type']=='file'))
              except Exception as e:
                  print(asset, type(e).__name__, str(e))
                  (out / (asset + '-error.txt')).write_text(str(e))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-asset-source-review
          path: ${{ runner.temp }}/nvidia-review/
          retention-days: 7
