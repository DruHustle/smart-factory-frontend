name: OpenUSD section and release qualification
on:
  push:
    branches: [feat/openusd-section-qualification]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    if: github.ref == 'refs/heads/feat/openusd-section-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ github.sha }}', persist-credentials: true }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10.34.5 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Associate the model selector with an unambiguous accessible label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/EquipmentView.tsx'); s=p.read_text()
          if 'id="local-model-template"' not in s:
              old='                <label className="text-sm">\n                  Local model/template\n                  <select'
              new='                <div className="text-sm">\n                  <label htmlFor="local-model-template">Local model/template</label>\n                  <select\n                    id="local-model-template"'
              assert s.count(old)==1
              s=s.replace(old,new)
              old='                  </select>\n                </label>\n                {modelRevision && selectedTemplate.error && ('
              new='                  </select>\n                </div>\n                {modelRevision && selectedTemplate.error && ('
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          PY
          pnpm exec prettier --write client/src/pages/EquipmentView.tsx
      - name: Type and regression checks
        run: |
          pnpm check
          python3 -m unittest discover -s scripts/equipment/openusd -p 'test_*.py' -v
          pnpm exec vitest run server/equipment/openusd.test.ts server/equipment/industrial-release.test.ts server/equipment/inspection.test.ts
      - name: Retain source changes on the isolated branch
        env: { EXPECTED: '${{ github.sha }}' }
        run: |
          remote=$(git ls-remote origin refs/heads/feat/openusd-section-qualification | cut -f1)
          [[ "$remote" == "$EXPECTED" ]] || { echo 'Branch advanced; refusing to overwrite work.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/EquipmentView.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Associate the imported-model selector with its accessible label'
            git push origin HEAD:refs/heads/feat/openusd-section-qualification
          fi
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Qualify authenticated import and persistent equipment views
        run: pnpm e2e:equipment --grep NVIDIA
      - name: Qualify actual NVIDIA geometry and browser failure behavior
        run: node scripts/equipment/qualify-openusd.mjs
      - name: Retain visual and end-to-end evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-section-qualification
          path: |
            test-results/
            playwright-report/
          retention-days: 7
