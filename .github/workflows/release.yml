# Legacy Render workflow: disabled in GitHub after the Oracle migration.
# Keep disabled until replaced with Oracle deployment automation.
name: Release Vercel UI and six-service Render bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Optional full backend commit SHA; empty uses backend main
        required: false
        type: string
      edge_sha:
        description: Optional full edge commit SHA; empty uses edge master
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: factory-production-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.RENDER_ROLLBACK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      backend_sha: ${{ steps.resolved-sources.outputs.backend_sha }}
      edge_sha: ${{ steps.resolved-sources.outputs.edge_sha }}
    steps:
      - name: Select companion source references
        id: source-refs
        env:
          REQUESTED_BACKEND_SHA: ${{ inputs.backend_sha }}
          REQUESTED_EDGE_SHA: ${{ inputs.edge_sha }}
        run: |
          select_ref() {
            local requested="$1"
            local name="$2"
            if [[ -n "$requested" && ! "$requested" =~ ^[a-f0-9]{40}$ ]]; then
              echo "$name must be an empty value or a full 40-character lowercase commit SHA" >&2
              exit 1
            fi
            if [[ -n "$requested" ]]; then
              printf '%s' "$requested"
            else
              printf 'main'
            fi
          }
          echo "backend_ref=$(select_ref "$REQUESTED_BACKEND_SHA" backend_sha)" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED_EDGE_SHA" ]]; then
            echo "edge_ref=$(select_ref "$REQUESTED_EDGE_SHA" edge_sha)" >> "$GITHUB_OUTPUT"
          else
            echo "edge_ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: smart-factory-iot, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/smart-factory-iot-backend
          ref: ${{ steps.source-refs.outputs.backend_ref }}
          path: smart-factory-iot-backend
          token: ${{ secrets.REPOSITORY_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/smart-factory-iot-edge
          ref: ${{ steps.source-refs.outputs.edge_ref }}
          path: smart-factory-iot-edge
          token: ${{ secrets.REPOSITORY_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Record immutable companion source revisions
        id: resolved-sources
        run: |
          BACKEND_SHA=$(git -C smart-factory-iot-backend rev-parse HEAD)
          EDGE_SHA=$(git -C smart-factory-iot-edge rev-parse HEAD)
          [[ "$BACKEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EDGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "backend_sha=$BACKEND_SHA" >> "$GITHUB_OUTPUT"
          echo "edge_sha=$EDGE_SHA" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { package_json_file: smart-factory-iot/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: smart-factory-iot/pnpm-lock.yaml }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 10.0.403 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Audit all NuGet dependencies
        run: dotnet restore smart-factory-iot-backend/src/SmartFactory.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high -warnaserror:NU1900,NU1903,NU1904 --force-evaluate
      - name: Backend build and tests
        run: dotnet test smart-factory-iot-backend/src/SmartFactory.sln -c Release --no-restore
      - name: Gateway tests and firmware compile
        run: |
          python -m pip install -r smart-factory-iot-edge/raspberry-pi/requirements.txt platformio==6.2.0
          python -m unittest discover -s smart-factory-iot-edge/raspberry-pi/tests -v
          pio run --project-dir smart-factory-iot-edge/esp32-wrover --environment compile-check
      - name: Audit gateway dependency tree
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r smart-factory-iot-edge/raspberry-pi/requirements.txt --strict --progress-spinner off
      - name: Dashboard checks and Chromium workflows
        working-directory: smart-factory-iot
        env:
          E2E_PORT: '3100'
          REQUIRE_COMPANION_REPOS: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
          pnpm docs:check
          pnpm deployment:check
          pnpm build
          pnpm audit --audit-level=moderate
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test the six-service image
        working-directory: smart-factory-iot
        run: |
          python scripts/prepare-backend-context.py ../smart-factory-iot-backend "$RUNNER_TEMP/backend-context"
          docker buildx build --load --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg BACKEND_SOURCE_REVISION="$(git -C ../smart-factory-iot-backend rev-parse HEAD)" --build-arg EDGE_SOURCE_REVISION="$(git -C ../smart-factory-iot-edge rev-parse HEAD)" --build-context backend="$RUNNER_TEMP/backend-context" -f deploy/render/Dockerfile -t smart-factory-render-review:local .
          python scripts/bundle-smoke.py
      - name: Audit the exact runtime image locally
        working-directory: smart-factory-iot
        run: python scripts/audit-container.py --output "$RUNNER_TEMP/container-audit.json"
      - name: Retain vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-vulnerability-report
          path: ${{ runner.temp }}/container-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Test real AAS MQTT and gateway command paths
        working-directory: smart-factory-iot
        env:
          DATABASE_PASSWORD: isolated-ci-dashboard-password
          REDIS_PASSWORD: isolated-ci-redis-password
          BASYX_DB_PASSWORD: isolated-ci-aas-password
          JWT_SECRET: isolated-ci-session-secret-at-least-32-bytes
          BACKEND_DEPLOYMENT_MODE: standalone
        run: |
          trap 'docker compose --env-file /dev/null -p factory-ci-aas --profile aas down --volumes --remove-orphans' EXIT
          docker compose --env-file /dev/null -p factory-ci-aas --profile aas up -d --wait aas-repository aas-registry submodel-repository submodel-registry concept-description-repository aasx-file-server
          python scripts/cross-repo-smoke.py
      - name: Save the exact tested image
        run: docker save smart-factory-render-review:local | gzip > "$RUNNER_TEMP/bundle.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-render-image
          path: ${{ runner.temp }}/bundle.tar.gz
          retention-days: 7
          compression-level: 0
  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
      RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
      RENDER_WEB_API_ORIGIN: ${{ vars.RENDER_WEB_API_ORIGIN }}
      RENDER_API_ORIGIN: ${{ vars.RENDER_WEB_API_ORIGIN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: /api
      VITE_ENABLE_DEMO_ACCOUNTS: 'true'
    steps:
      - name: Require release configuration
        run: |
          for key in RENDER_API_KEY RENDER_WEB_SERVICE_ID RENDER_WORKER_SERVICE_ID RENDER_WEB_API_ORIGIN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [[ -n "${!key}" ]] || { echo "Missing release configuration: $key"; exit 1; }
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: smart-factory-iot, persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { package_json_file: smart-factory-iot/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: smart-factory-iot/pnpm-lock.yaml }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: tested-render-image, path: '${{ runner.temp }}' }
      - name: Publish immutable bundle and source manifest
        working-directory: smart-factory-iot
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          BACKEND_SHA: ${{ needs.verify.outputs.backend_sha }}
          EDGE_SHA: ${{ needs.verify.outputs.edge_sha }}
        run: |
          docker load -i "$RUNNER_TEMP/bundle.tar.gz"
          IMAGE="ghcr.io/${REPO_OWNER,,}/smart-factory-backend"
          docker tag smart-factory-render-review:local "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)
          echo "RELEASE_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
          python -c 'import os,json,sys; json.dump({"dashboard":os.environ["GITHUB_SHA"],"backend":os.environ["BACKEND_SHA"],"edge":os.environ["EDGE_SHA"],"image":sys.argv[1]},open("release-manifest.json","w"),indent=2)' "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: production-release-manifest, path: smart-factory-iot/release-manifest.json }
      - name: Deploy reviewed backend and await readiness
        working-directory: smart-factory-iot
        run: python scripts/deploy-render.py
      - name: Configure and deploy Vercel UI
        working-directory: smart-factory-iot
        run: |
          pnpm install --frozen-lockfile
          pnpm vercel:configure
          pnpm dlx vercel@62.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@62.2.0 build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@62.2.0 deploy --prebuilt --archive=tgz --prod --yes --token="$VERCEL_TOKEN"
