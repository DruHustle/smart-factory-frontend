name: Diagnostic only - exact revision factory floor comparison

# A comparison, never a deployment or an exact-revision release qualification.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/floor-ab-diagnostic.yml'
      - 'scripts/qualification/floor-ab-prepare.py'
      - 'scripts/qualification/floor-ab-report.py'

permissions:
  contents: read

jobs:
  compare:
    name: Diagnostic only - baseline and candidate whole-factory cases
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out diagnostic scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out exact baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f29c50cb5d35b57b8d12bcc86479a634140609a7
          path: baseline
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ffb7ce8ecfc0c17ac4070442f9ca489a3abaac5
          path: candidate
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify source revisions, matching fixtures and original limits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = f29c50cb5d35b57b8d12bcc86479a634140609a7
          test "$(git -C candidate rev-parse HEAD)" = 0ffb7ce8ecfc0c17ac4070442f9ca489a3abaac5
          for repo in baseline candidate; do
            test -z "$(git -C "$repo" status --porcelain --untracked-files=no)"
            grep -Fq 'timeout: 60000' "$repo/playwright.experience.config.ts"
            grep -Fq 'retries: 0' "$repo/playwright.experience.config.ts"
            grep -Fq '{ timeout: 30000 }' "$repo/e2e/overview.spec.ts"
          done
          for file in package.json pnpm-lock.yaml playwright.experience.config.ts \
              e2e/overview.spec.ts e2e/experience-helpers.ts scripts/experience/e2e.sh \
              docker-compose.e2e.yml scripts/security/seed-test-accounts.ts \
              scripts/workspace/seed.ts scripts/showcase/seed.ts scripts/showcase/verify.ts; do
            cmp "baseline/$file" "candidate/$file"
          done
      - name: Install baseline dependencies
        working-directory: baseline
        run: pnpm install --frozen-lockfile
      - name: Install candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Install the pinned browser
        working-directory: baseline
        run: pnpm exec playwright install --with-deps chromium
      - name: Isolate the disposable fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd baseline && pnpm exec playwright --version)" = "$(cd candidate && pnpm exec playwright --version)"
          for repo in baseline candidate; do
            python3 diagnostic/scripts/qualification/floor-ab-prepare.py "$repo"
            test "$(git -C "$repo" diff --name-only)" = scripts/experience/e2e.sh
            git -C "$repo" diff --quiet HEAD -- client server shared e2e playwright.experience.config.ts
          done
          cmp baseline/e2e/overview.spec.ts candidate/e2e/overview.spec.ts
      - name: Run the four unchanged whole-factory cases in ABBA order
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /dev/null
          FLOOR_GREP: 'Overview graphics whole factory (390|1440)px (light|dark)'
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          umask 077
          private="$RUNNER_TEMP/floor-ab-private"
          out="$RUNNER_TEMP/floor-ab-results"
          mkdir -p "$private" "$out"
          printf 'sample\tvariant\texit\tcleanup\n' > "$private/status.tsv"
          for sample in baseline-1 candidate-1 candidate-2 baseline-2; do
            variant="${sample%-*}"
            project="sf-floor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sample}"
            set +e
            (
              cd "$GITHUB_WORKSPACE/$variant"
              PLAYWRIGHT_JSON_OUTPUT_FILE="$private/${sample}-report.json" \
              EXPERIENCE_DIAGNOSTIC_PROJECT="$project" \
              EXPERIENCE_E2E_PORT=3123 E2E_DATABASE_PORT=55450 E2E_REDIS_PORT=56400 \
              OVERVIEW_EVIDENCE_DIR="$private/${sample}-visual" \
              pnpm e2e:experience --grep "$FLOOR_GREP" --reporter=json
            ) > "$private/${sample}.log" 2>&1
            test_exit=$?
            set -e
            cleanup=0
            (
              cd "$GITHUB_WORKSPACE/$variant"
              E2E_DATABASE_PORT=0 E2E_REDIS_PORT=0 \
                docker compose --env-file /dev/null -p "$project" \
                -f docker-compose.e2e.yml down --volumes --remove-orphans
            ) > "$private/${sample}-cleanup.log" 2>&1 || cleanup=1
            for type in container network volume; do
              if [ "$type" = container ]; then
                remaining="$(docker container ls -aq --filter "label=com.docker.compose.project=$project")" || cleanup=1
              else
                remaining="$(docker "$type" ls -q --filter "label=com.docker.compose.project=$project")" || cleanup=1
              fi
              test -z "$remaining" || cleanup=1
            done
            printf '%s\t%s\t%s\t%s\n' "$sample" "$variant" "$test_exit" "$cleanup" >> "$private/status.tsv"
            # A failed cleanup could contaminate the next fixture or occupy its ports.
            if [ "$cleanup" -ne 0 ]; then break; fi
          done
          # The reporter accepts only fixed categories and numeric values. Raw
          # logs, JSON reports, screenshots, video and traces stay on the runner.
          python3 diagnostic/scripts/qualification/floor-ab-report.py \
            "$private/status.tsv" "$private" "$out/summary.json"
      - name: Retain the sanitized diagnostic summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floor-ab-diagnostic-numeric
          path: ${{ runner.temp }}/floor-ab-results/summary.json
          if-no-files-found: warn
          retention-days: 7
