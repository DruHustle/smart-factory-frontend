name: Native 3D rendering

on:
  pull_request:
    paths:
      - "client/src/components/equipment/**"
      - "client/src/assets/equipment/**"
      - "scripts/equipment/**"
      - ".github/workflows/renderer-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10.34.5 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify real models, previews, lighting fallback and inspection
        run: node scripts/equipment/qualify-rendering.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-3d-rendering
          path: test-results/rendering
