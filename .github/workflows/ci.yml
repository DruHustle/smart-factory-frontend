name: Dashboard quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    # Database-backed suites intentionally share mutable fixture tables.
    env:
      VITEST_MAX_WORKERS: "1"
    # Playwright 1.58.2 supports Ubuntu 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_factory_iot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d smart_factory_iot_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      - name: Setup PNPM
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/smart_factory_iot_e2e
          DATABASE_SSL_MODE: disable
        run: pnpm exec drizzle-kit migrate

      - name: Verify proposed Onesa contract snapshots
        run: |
          node --import tsx scripts/onesa/generate-contract.ts --check
          node --import tsx scripts/equipment/generate-schemas.ts --check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - name: Validate AAS 3.0 and packaged model/document fixtures
        run: |
          python -m venv "$RUNNER_TEMP/onesa-aas"
          "$RUNNER_TEMP/onesa-aas/bin/pip" install -r scripts/equipment/requirements-aas.txt
          "$RUNNER_TEMP/onesa-aas/bin/python" scripts/equipment/validate-artifacts.py

      - name: Type Check
        run: pnpm check

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/smart_factory_iot_e2e
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/smart_factory_iot_e2e
          DATABASE_SSL_MODE: disable
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        env: { E2E_PORT: "3100" }
        run: pnpm e2e

      - name: Verify isolated read-only public walkthrough
        run: pnpm e2e:public-demo

      - name: Verify independent native equipment view
        run: pnpm e2e:equipment

      - name: Verify independent cybersecurity workspace
        run: pnpm e2e:security

      - name: Build Frontend
        run: pnpm build

      - name: Validate documentation and deployment configuration
        run: |
          pnpm docs:check
          pnpm deployment:check

      - name: Verify Build Output
        run: |
          if [ ! -d "dist/public" ]; then
            echo "Error: dist/public directory not found!"
            exit 1
          fi
          if [ ! -f "dist/public/index.html" ]; then
            echo "Error: dist/public/index.html not found!"
            exit 1
          fi
          echo "Build verification passed"
          ls -lah dist/public/

      - name: Dependency security audit
        run: pnpm audit --audit-level=moderate

  unified-workspace:
    name: Unified workspace journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10.34.5 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:workspace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-rendered-evidence
          path: test-results/
          if-no-files-found: warn

  visual-workspaces:
    name: Visual navigation and overview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10.34.5 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify graphical navigation, source scope, typography and model preview
        run: pnpm e2e:experience --grep 'Overview graphics'
        env:
          OVERVIEW_EVIDENCE_DIR: test-results/visual-first
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-workspace-evidence
          path: test-results/
          if-no-files-found: warn

  trusted-cross-service:
    name: Broker, evidence and restore contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, path: smart-factory-iot-frontend}
      - name: Read immutable companion identities
        id: refs
        working-directory: smart-factory-iot-frontend
        run: |
          node --input-type=module -e 'import fs from "node:fs";const refs=JSON.parse(fs.readFileSync("deploy/qualification-sources.json","utf8"));for(const name of ["backend","edge"]){if(!/^[a-f0-9]{40}$/.test(refs[name]))throw Error("Immutable source required");fs.appendFileSync(process.env.GITHUB_OUTPUT,`${name}=${refs[name]}\n`);}'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DruHustle/smart-factory-iot-backend
          ref: ${{ steps.refs.outputs.backend }}
          path: smart-factory-iot-backend
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DruHustle/smart-factory-iot-edge
          ref: ${{ steps.refs.outputs.edge }}
          path: smart-factory-iot-edge
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: {version: 10.34.5}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: pnpm, cache-dependency-path: smart-factory-iot-frontend/pnpm-lock.yaml}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: 10.0.403}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Prepare pinned runtime dependencies
        run: |
          pnpm --dir smart-factory-iot-frontend install --frozen-lockfile
          python -m venv "$RUNNER_TEMP/edge-proof"
          "$RUNNER_TEMP/edge-proof/bin/pip" install --require-hashes -r smart-factory-iot-edge/raspberry-pi/requirements.txt
          dotnet build smart-factory-iot-backend/src/Services/TelemetryService/TelemetryService.csproj -c Release
      - name: Verify real broker delivery and disposable restore
        working-directory: smart-factory-iot-frontend
        env:
          QUALIFICATION_EVIDENCE_DIR: ${{ runner.temp }}/trusted-path
          QUALIFICATION_DOTNET: dotnet
        run: |
          MQTT_PROOF_BROKER=rabbitmq QUALIFICATION_EVIDENCE_DIR="$RUNNER_TEMP/trusted-path/rabbitmq" "$RUNNER_TEMP/edge-proof/bin/python" scripts/qualification/trusted-path.py
          MQTT_PROOF_BROKER=mosquitto QUALIFICATION_EVIDENCE_DIR="$RUNNER_TEMP/trusted-path/mosquitto" "$RUNNER_TEMP/edge-proof/bin/python" scripts/qualification/trusted-path.py
          MQTT_PROOF_BROKER=mosquitto MQTT_PROOF_PROTOCOL=3.1.1-historical QUALIFICATION_EVIDENCE_DIR="$RUNNER_TEMP/trusted-path/mqtt3-historical" "$RUNNER_TEMP/edge-proof/bin/python" scripts/qualification/trusted-path.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trusted-cross-service-evidence
          path: |
            ${{ runner.temp }}/trusted-path/**/result.json
            ${{ runner.temp }}/trusted-path/**/services.log
          if-no-files-found: warn

  aas-cross-service:
    name: AAS provisioning and command boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, path: smart-factory-iot-frontend}
      - name: Read immutable companion identities
        id: refs
        working-directory: smart-factory-iot-frontend
        run: |
          node --input-type=module -e 'import fs from "node:fs";const refs=JSON.parse(fs.readFileSync("deploy/qualification-sources.json","utf8"));for(const name of ["backend","edge"]){if(!/^[a-f0-9]{40}$/.test(refs[name]))throw Error("Immutable source required");fs.appendFileSync(process.env.GITHUB_OUTPUT,`${name}=${refs[name]}\n`);}'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DruHustle/smart-factory-iot-backend
          ref: ${{ steps.refs.outputs.backend }}
          path: smart-factory-iot-backend
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DruHustle/smart-factory-iot-edge
          ref: ${{ steps.refs.outputs.edge }}
          path: smart-factory-iot-edge
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: {version: 10.34.5}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: pnpm, cache-dependency-path: smart-factory-iot-frontend/pnpm-lock.yaml}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: 10.0.403}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Prepare pinned runtime dependencies
        run: |
          pnpm --dir smart-factory-iot-frontend install --frozen-lockfile
          python -m venv "$RUNNER_TEMP/edge-proof"
          "$RUNNER_TEMP/edge-proof/bin/pip" install --require-hashes -r smart-factory-iot-edge/raspberry-pi/requirements.txt
          dotnet build smart-factory-iot-backend/src/Services/TelemetryService/TelemetryService.csproj -c Release
      - name: Verify disposable AAS import, provisioning and simulated serial path
        working-directory: smart-factory-iot-frontend
        env:
          QUALIFICATION_DOTNET: dotnet
        run: '"$RUNNER_TEMP/edge-proof/bin/python" scripts/cross-repo-smoke.py'
